<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guida TV">
<link rel="manifest" href="manifest.json">
<title>Guida TV</title>
<style>
:root{--bg:#f3f1ee;--card:#fff;--ink:#1b1b1f;--mute:#6d6d76;--line:#e4e1dc;--accent:#d8232a;--bar:#e9e6e1}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--card:#1d1e23;--ink:#f1f1f3;--mute:#9a9aa5;--line:#2c2d34;--bar:#2c2d34}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,"SF Pro Text",system-ui,sans-serif;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:14px 24px;
background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
#clock{color:var(--mute);font-size:17px;margin-right:auto}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 18px;border-radius:999px;min-height:44px}
button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px;padding:20px 24px 40px;max-width:1500px;margin:auto}
.ch{background:var(--card);border-radius:20px;border:1px solid var(--line);overflow:hidden}
.ch-h{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.logo{width:76px;height:44px;object-fit:contain;flex:none}
.badge{width:76px;height:44px;border-radius:10px;background:var(--bar);display:grid;place-items:center;font-weight:800;flex:none}
.ch-h b{font-size:18px}
.p{display:flex;gap:14px;padding:12px 18px;border-top:1px solid var(--line)}
.p:first-of-type{border-top:0}
.t{width:52px;flex:none;color:var(--mute);font-variant-numeric:tabular-nums;font-weight:600}
.body{flex:1;min-width:0}
.name{font-weight:600}
.d{color:var(--mute);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.poster{width:60px;height:90px;border-radius:8px;object-fit:cover;flex:none;background:var(--bar)}
.now{background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.now .t{color:var(--accent)}
.bar{height:5px;background:var(--bar);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.msg{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 0}
@media (max-width:700px){main{grid-template-columns:1fr;padding:12px}}
</style>
</head>
<body>
<header>
  <h1>Guida TV</h1>
  <span id="clock"></span>
  <button id="films" aria-pressed="false">Solo film</button>
</header>
<main id="app"><p class="msg">Caricamento…</p></main>
<script>
const app=document.getElementById('app'),clock=document.getElementById('clock'),btn=document.getElementById('films');
let data=null,onlyFilms=false;
const hhmm=t=>new Date(t).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isFilm=p=>!!p.p||/film|movie|cinema/i.test(p.c||'');

function render(){
  if(!data)return;
  const now=Date.now();
  clock.textContent=new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})+' · ore '+hhmm(now);
  const cards=data.channels.map(ch=>{
    let list=ch.programs.filter(p=>Date.parse(p.e)>now);
    if(onlyFilms)list=list.filter(isFilm);
    list=list.slice(0,onlyFilms?6:8);
    if(!list.length)return '';
    const logo=ch.logo?`<img class="logo" src="${esc(ch.logo)}" alt="${esc(ch.name)}" loading="lazy" onerror="this.outerHTML='<div class=badge>${esc(ch.name.slice(0,3))}</div>'">`:`<div class="badge">${esc(ch.name.slice(0,3))}</div>`;
    const rows=list.map(p=>{
      const s=Date.parse(p.s),e=Date.parse(p.e),live=s<=now;
      const pct=Math.max(0,Math.min(100,(now-s)/(e-s)*100));
      return `<div class="p${live?' now':''}"><div class="t">${live?'Ora':hhmm(s)}</div>
      <div class="body"><div class="name">${esc(p.t)}</div>${p.d?`<div class="d">${esc(p.d)}</div>`:''}${live?`<div class="bar"><i style="width:${pct}%"></i></div>`:''}</div>
      ${p.p?`<img class="poster" src="${esc(p.p)}" alt="" loading="lazy">`:''}</div>`;
    }).join('');
    return `<section class="ch"><div class="ch-h">${logo}<b>${esc(ch.name)}</b></div>${rows}</section>`;
  }).join('');
  app.innerHTML=cards||'<p class="msg">Nessun programma da mostrare.</p>';
}
async function load(){
  try{
    const r=await fetch('guide.json?'+Date.now());
    if(!r.ok)throw 0;
    data=await r.json();render();
  }catch(e){app.innerHTML='<p class="msg">Dati non ancora disponibili. Esegui l’aggiornamento da GitHub (vedi LEGGIMI).</p>';}
}
btn.onclick=()=>{onlyFilms=!onlyFilms;btn.setAttribute('aria-pressed',onlyFilms);render();};
load();setInterval(render,60000);setInterval(load,30*60000);
</script>
</body>
</html>
