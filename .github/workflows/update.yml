name: Aggiorna palinsesti
on:
  schedule: [{ cron: '0 */6 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Scarica i palinsesti (iptv-org/epg)
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git epg-src
          cd epg-src && npm install
          npm run grab --- --sites=guidatv.sky.tv --days=2 --output=../epg/guide.xml
      - name: Crea guide.json
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          npm install --no-save fast-xml-parser
          node scripts/build.mjs
      - name: Salva i dati
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add guide.json tmdb-cache.json
          git commit -m "Aggiorna palinsesti" || echo "Nessuna modifica"
          git push
